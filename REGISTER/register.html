<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <div class="container">
        <div class="row">
            <div class="black">
            <div class="loginbox">
                <div class="items">
                    <div class="mb-3">
                        <h2>Register</h2>
                        <hr class="loginhr">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" placeholder="Choose a username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Your password must be 8-20 characters long with numbers." required>
                    </div>
                    <div class="mb-3">
                        <label for="confirmpassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmpassword" placeholder="Confirm your password." required>
                    </div>
                    <button class="btn btn-dark" id="submit">Register</button>
                    <hr class="logafhr">
                    <span>Already have an account? <a href="../LOGIN/login.html">Click here to login!</a></span>
                </div>
            </div>
        </div>
    </div>

</body>
