<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torpedo - [Ide majd kikéne irnom a room id-]</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Torpedó Játék</h1>
    
    <div class="game-container">
        <div class="board-container">
            <h2>Hajok elhelyezése</h2>
            <div id="placementBoard" class="board"></div>
        </div>
        
        <div class="board-container">
            <h2>Lövés eredménye</h2>
            <div id="shootingBoard" class="board"></div>
        </div>
    </div>
    
    <div id="status">Az ellenfél következik...</div>
    
    <button id="doneButton">Kész</button>
    
    <script src="script.js"></script>
</body>
</html>
