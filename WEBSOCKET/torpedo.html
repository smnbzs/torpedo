<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Battleship Game</h1>
    
    <div class="game-container">
        <div class="board-container">
            <h2>Place Your Ships</h2>
            <div class="ship-info">
                <p>Press 'R' to rotate ships</p>
                <ul class="ship-list">
                    <li>Carrier (5)</li>
                    <li>Battleship (4)</li>
                    <li>Cruiser (3)</li>
                    <li>Submarine (3)</li>
                    <li>Destroyer (2)</li>
                </ul>
            </div>
            <div id="placementBoard" class="board"></div>
        </div>
        
        <div class="board-container">
            <h2>Shot Results</h2>
            <div id="shootingBoard" class="board"></div>
        </div>
    </div>
    
    <div id="status">Opponent's turn...</div>
    
    <button id="doneButton">Ready</button>
    
    <script src="script.js"></script>
</body>
</html>
